[tools]
python = "3.11"

[tasks]
setup-docs = { run = "pip install -r requirements.txt", description = "Install MkDocs and Materialx theme" }
serve = { run = "mkdocs serve", description = "Start local live-reload documentation server" }
build = { run = "mkdocs build", description = "Build static documentation site" }
reinstall = {run = "pip install --force-reinstall mkdocs-materialx", description="Reinstall materialx"}
dirty = { run = "mkdocs serve --dirtyreload", description = "Start dirty load of site" }
port = { run = "mkdocs serve -o -a localhost:8012 ", description = "Start local live-reload documentation server" }
deploy = { run = "mkdocs gh-deploy --force", description = "Build and deploy documentation to GitHub Pages" }
